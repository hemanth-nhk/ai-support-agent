<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Support Agent - Your Online Store Assistant</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <!-- Top Header -->
    <header class="top-nav">
      <div class="nav-left">
        <div class="app-logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <div class="app-branding">
          <h1 class="brand-title">AI Support Agent</h1>
          <p class="brand-subtitle">Your Online Store Assistant</p>
        </div>
      </div>

      <div class="nav-right">
        <button id="themeToggleQuickBtn" class="nav-btn icon-only" title="Toggle theme" aria-label="Toggle theme">
          <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <button id="newChatBtn" class="nav-btn btn-pill-outline">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>New Chat</span>
        </button>

        <button id="toggleSettingsBtn" class="nav-btn icon-only active-accent" title="Settings" aria-label="Toggle settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>

        <div class="user-badge" title="User Account">
          <span class="user-initial">H</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>
    </header>

    <!-- Main Workspace Container: Left Sidebar + Center Chat + Right Settings -->
    <div class="main-body">
      <!-- 1. Left Sidebar -->
      <aside class="sidebar-left">
        <!-- Navigation Menu -->
        <nav class="sidebar-nav">
          <button class="nav-item active" data-action="chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>Chat</span>
          </button>
          <button class="nav-item" data-action="order-tracking" data-prompt="Where is my order 1001?">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="1" y="3" width="15" height="13"></rect>
              <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
              <circle cx="5.5" cy="18.5" r="2.5"></circle>
              <circle cx="18.5" cy="18.5" r="2.5"></circle>
            </svg>
            <span>Order Tracking</span>
          </button>
          <button class="nav-item" data-action="returns" data-prompt="What is your return and refund policy?">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="16.5 9.4 7.55 4.24"></polyline>
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
              <polyline points="3.29 7 12 12.01 20.71 7"></polyline>
              <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            <span>Returns & Refunds</span>
          </button>
          <button class="nav-item" data-action="products" data-prompt="Find orders for Laptop">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-3z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <span>Browse Products</span>
          </button>
          <button class="nav-item" data-action="faq" data-prompt="What is your shipping policy?">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            <span>Help & FAQ</span>
          </button>
        </nav>

        <!-- Recent Chats Section -->
        <div class="recent-chats-container">
          <div class="sidebar-section-title">Recent Chats</div>
          <div class="recent-chats-list">
            <button class="recent-chat-item" data-prompt="Where is my order 1001?">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="1" y="3" width="15" height="13"></rect>
                <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
                <circle cx="5.5" cy="18.5" r="2.5"></circle>
                <circle cx="18.5" cy="18.5" r="2.5"></circle>
              </svg>
              <div class="recent-chat-text">
                <span class="recent-chat-title">Order 1001 status</span>
                <span class="recent-chat-time">2 min ago</span>
              </div>
            </button>
            <button class="recent-chat-item" data-prompt="What is your return and refund policy?">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="16.5 9.4 7.55 4.24"></polyline>
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
              </svg>
              <div class="recent-chat-text">
                <span class="recent-chat-title">Return policy</span>
                <span class="recent-chat-time">15 min ago</span>
              </div>
            </button>
            <button class="recent-chat-item" data-prompt="Find orders for Laptop">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <div class="recent-chat-text">
                <span class="recent-chat-title">Find orders for Laptop</span>
                <span class="recent-chat-time">1 hour ago</span>
              </div>
            </button>
            <button class="recent-chat-item" data-prompt="How long does standard shipping take?">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
              <div class="recent-chat-text">
                <span class="recent-chat-title">Shipping information</span>
                <span class="recent-chat-time">2 hours ago</span>
              </div>
            </button>
            <button class="recent-chat-item" data-prompt="Can I cancel my order?">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="1" y="3" width="15" height="13"></rect>
                <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
                <circle cx="5.5" cy="18.5" r="2.5"></circle>
                <circle cx="18.5" cy="18.5" r="2.5"></circle>
              </svg>
              <div class="recent-chat-text">
                <span class="recent-chat-title">Cancel my order</span>
                <span class="recent-chat-time">3 hours ago</span>
              </div>
            </button>
          </div>
        </div>

        <!-- Session Status Footer in Sidebar -->
        <div class="sidebar-footer">
          <div class="session-card">
            <span class="session-pulse-dot"></span>
            <div class="session-details">
              <span class="session-title">Session Active</span>
              <span class="session-uuid" id="sessionUuidText">c7c7c7f5-...</span>
            </div>
          </div>
        </div>
      </aside>

      <!-- 2. Center Chat Workspace -->
      <main class="chat-center" id="chatMain">
        <div class="chat-scroll-area">
          <!-- Hero Welcome Card -->
          <div class="hero-welcome-card" id="emptyState">
            <div class="hero-header">
              <div class="hero-icon-box">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6.4-4.8-6.4 4.8 2.4-7.2-6-4.8h7.6z"/>
                </svg>
              </div>
              <div class="hero-text-content">
                <h2 class="hero-title">Welcome to AI Support Agent</h2>
                <p class="hero-subtitle">I can help you with order tracking, returns, product information, and more.</p>
              </div>
            </div>

            <div class="quick-cards-grid">
              <button class="quick-card" data-prompt="Where is my order 1001?">
                <div class="quick-card-icon icon-blue">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="1" y="3" width="15" height="13"></rect>
                    <polygon points="16 8 20 8 23 11 23 16 16 16 8"></polygon>
                    <circle cx="5.5" cy="18.5" r="2.5"></circle>
                    <circle cx="18.5" cy="18.5" r="2.5"></circle>
                  </svg>
                </div>
                <div class="quick-card-info">
                  <span class="quick-card-title">Track my order</span>
                  <span class="quick-card-desc">Check order status</span>
                </div>
              </button>

              <button class="quick-card" data-prompt="What is your return and refund policy?">
                <div class="quick-card-icon icon-blue">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="16.5 9.4 7.55 4.24"></polyline>
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                  </svg>
                </div>
                <div class="quick-card-info">
                  <span class="quick-card-title">Returns & refunds</span>
                  <span class="quick-card-desc">Learn about our policy</span>
                </div>
              </button>

              <button class="quick-card" data-prompt="Find orders for Laptop">
                <div class="quick-card-icon icon-blue">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-3z"></path>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                  </svg>
                </div>
                <div class="quick-card-info">
                  <span class="quick-card-title">Find products</span>
                  <span class="quick-card-desc">Search our catalog</span>
                </div>
              </button>

              <button class="quick-card" data-prompt="How do cancellations work?">
                <div class="quick-card-icon icon-blue">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                  </svg>
                </div>
                <div class="quick-card-info">
                  <span class="quick-card-title">Get help</span>
                  <span class="quick-card-desc">FAQs and support</span>
                </div>
              </button>
            </div>
          </div>

          <!-- Messages Stream -->
          <div class="messages-stream" id="messagesList" style="display: none;"></div>
        </div>

        <!-- Bottom Integrated Composer -->
        <div class="composer-outer">
          <form class="composer-card" id="chatForm">
            <textarea
              id="messageInput"
              class="composer-textarea"
              placeholder="Type your question or request..."
              rows="1"
              maxlength="500"
              required
            ></textarea>

            <div class="composer-toolbar">
              <div class="toolbar-left">
                <button type="button" class="toolbar-btn" title="Attach file">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                  </svg>
                </button>
                <button type="button" class="toolbar-btn" title="Search web">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                  </svg>
                </button>
                <span class="toolbar-hint">Ask about orders, returns, products, or general help...</span>
              </div>

              <div class="toolbar-right">
                <button type="submit" id="sendBtn" class="send-action-btn" title="Send message" aria-label="Send">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                  </svg>
                </button>
              </div>
            </div>
          </form>
        </div>
      </main>

      <!-- 3. Right Settings Container ONLY (avoiding extra right tab elements) -->
      <aside class="sidebar-right" id="sidebarRight">
        <div class="settings-container-panel">
          <div class="panel-section-header">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span class="section-title">Settings</span>
          </div>

          <!-- Support API Key block -->
          <div class="setting-block">
            <div class="setting-label-row">
              <label for="apiKeyInput" class="setting-label">Support API Key</label>
              <button class="tooltip-trigger" title="Required for private DATA_QUERY multi-order lookups">?</button>
            </div>
            <div class="key-input-wrapper">
              <input
                type="password"
                id="apiKeyInput"
                class="key-text-input"
                placeholder="Enter API key"
                autocomplete="off"
              />
              <button type="button" id="toggleKeyVisibilityBtn" class="visibility-btn" title="Toggle visibility">
                <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>

            <div class="key-actions-row">
              <div class="key-status-indicator" id="apiKeyStatusBox">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <span id="apiKeyStatusText">API key saved</span>
              </div>
              <button type="button" id="saveApiKeyBtn" class="btn-save-key">Save Key</button>
            </div>
          </div>

          <!-- Theme Selector block -->
          <div class="setting-block">
            <div class="setting-label-row">
              <span class="setting-label">Theme</span>
            </div>
            <div class="theme-segmented-group">
              <button type="button" class="theme-segment" data-theme-val="light">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="5"></circle>
                  <line x1="12" y1="1" x2="12" y2="3"></line>
                  <line x1="12" y1="21" x2="12" y2="23"></line>
                </svg>
                <span>Light</span>
              </button>
              <button type="button" class="theme-segment active" data-theme-val="dark">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <span>Dark</span>
              </button>
              <button type="button" class="theme-segment" data-theme-val="system">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                  <line x1="8" y1="21" x2="16" y2="21"></line>
                  <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
                <span>System</span>
              </button>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
